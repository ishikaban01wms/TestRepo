name: Clock Tracker Final

on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"

jobs:
  track-clock:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Project Data + Log Clock
        uses: actions/github-script@v7
        with:
          script: |
            const query = `
            query {
              viewer {
                projectsV2(first: 10) {
                  nodes {
                    title
                    items(first: 20) {
                      nodes {
                        content {
                          ... on Issue {
                            number
                            title
                          }
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2SingleSelectField {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }`;

            const result = await github.graphql(query);

            console.log("FULL DATA:");
            console.log(JSON.stringify(result, null, 2));

            for (const project of result.viewer.projectsV2.nodes) {
              console.log("Project:", project.title);

              for (const item of project.items.nodes) {
                if (!item.content) continue;

                const issue_number = item.content.number;

                for (const field of item.fieldValues.nodes) {
                  console.log("Field:", field.field?.name, "Value:", field.name);

                  // 👇 TRY MATCH (may or may not match yet)
                  if (field.field?.name === "Clock") {

                    if (field.name === "Start") {
                      await github.rest.issues.createComment({
                        ...context.repo,
                        issue_number,
                        body: "⏱️ Clock started"
                      });
                    }

                    if (field.name === "Stop") {
                      await github.rest.issues.createComment({
                        ...context.repo,
                        issue_number,
                        body: "⏱️ Clock stopped"
                      });
                    }

                  }
                }
              }
            }
