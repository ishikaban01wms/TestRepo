name: Clock Buttons

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  clock:
    runs-on: ubuntu-latest

    steps:
      - name: Handle commands
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.toLowerCase();
            const issue_number = context.payload.issue.number;

            if (comment.includes("/start")) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: "⏱️ Clock started"
              });
            }

            if (comment.includes("/stop")) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: "⏱️ Clock stopped"
              });
            }
