name: Clock Tracker Final

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"  # Run every 2 minutes
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize]
  project_card:
    types: [created, edited]

jobs:
  track-clock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Project Data + Log Clock
        uses: actions/github-script@v7
        with:
          script: |
            const query = `
            query {
              viewer {
                projectsV2(first: 10) {
                  nodes {
                    title
                    items(first: 20) {
                      nodes {
                        content {
                          ... on Issue {
                            number
                            title
                          }
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2SingleSelectField {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }`;

            const result = await github.graphql(query);

            console.log("FULL DATA:");
            console.log(JSON.stringify(result, null, 2));

            for (const project of result.viewer.projectsV2.nodes) {
              console.log("Project:", project.title);

              for (const item of project.items.nodes) {
                if (!item.content) continue;

                const issue_number = item.content.number;

                for (const field of item.fieldValues.nodes) {
                  if (field.field?.name === "Clock") {

                    if (field.name === "Start") {
                      console.log(`Issue #${issue_number} → Clock Started`);
                      await github.rest.issues.createComment({
                        ...context.repo,
                        issue_number,
                        body: "⏱️ Clock Started! Entry created."
                      });
                    }

                    if (field.name === "Stop") {
                      console.log(`Issue #${issue_number} → Clock Stopped`);
                      await github.rest.issues.createComment({
                        ...context.repo,
                        issue_number,
                        body: "⏱️ Clock Stopped! Entry created."
                      });
                    }

                  }
                }
              }
            }
