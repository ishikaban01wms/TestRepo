name: Smart Clock (Single Select)

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  clock:
    runs-on: ubuntu-latest

    steps:
      - name: Handle Clock
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label?.name || "";
            const issue_number = context.payload.issue.number;

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // helper to remove label
            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name
                });
              } catch (e) {}
            }

            // START
            if (label === "Clock: Start") {
              await removeLabel("Clock: Stop");

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: "⏱️ Clock started"
              });
            }

            // STOP
            if (label === "Clock: Stop") {
              await removeLabel("Clock: Start");

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: "⏱️ Clock stopped"
              });
            }
