name: Track Clock Field (Project)

on:
  workflow_dispatch:   # manual run ke liye
  schedule:
    - cron: "*/2 * * * *"   # har 2 min me run hoga

jobs:
  check-clock:
    runs-on: ubuntu-latest

    steps:
      - name: Check Project Clock Field
        uses: actions/github-script@v7
        with:
          script: |
            const query = `
            query {
              viewer {
                projectsV2(first: 10) {
                  nodes {
                    title
                    items(first: 20) {
                      nodes {
                        content {
                          ... on Issue {
                            number
                            title
                          }
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2SingleSelectField {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }`;

            const result = await github.graphql(query);

            for (const project of result.viewer.projectsV2.nodes) {
              if (project.title !== "TestProject") continue;

              for (const item of project.items.nodes) {
                if (!item.content) continue;

                const issue_number = item.content.number;

                for (const field of item.fieldValues.nodes) {
                  if (field.field.name === "Clock") {

                    if (field.name === "Start") {
                      await github.rest.issues.createComment({
                        ...context.repo,
                        issue_number,
                        body: "⏱️ Clock started"
                      });
                    }

                    if (field.name === "Stop") {
                      await github.rest.issues.createComment({
                        ...context.repo,
                        issue_number,
                        body: "⏱️ Clock stopped"
                      });
                    }

                  }
                }
              }
            }
