name: Clock Automation via GitHub Actions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize]
  project_card:
    types: [created, edited]

jobs:
  clock_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Determine Clock Status
        id: clock
        run: |
          echo "Event: $GITHUB_EVENT_NAME"

          CLOCK_STATUS=""

          if [[ "${GITHUB_EVENT_NAME}" == "project_card" ]]; then
            CARD_ID=$(jq -r '.project_card.id' $GITHUB_EVENT_PATH)
            DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                https://api.github.com/projects/columns/cards/$CARD_ID)
            CLOCK_STATUS=$(echo $DATA | jq -r '.note // empty')

          elif [[ "${GITHUB_EVENT_NAME}" == "issues" ]]; then
            ISSUE_NUMBER=$(jq -r '.issue.number' $GITHUB_EVENT_PATH)
            DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER)
            CLOCK_STATUS=$(echo $DATA | jq -r '.fields[]? | select(.name|test("clock";"i")) | .value // empty')

          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            PR_NUMBER=$(jq -r '.pull_request.number' $GITHUB_EVENT_PATH)
            DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER)
            CLOCK_STATUS=$(echo $DATA | jq -r '.fields[]? | select(.name|test("clock";"i")) | .value // empty')

          echo "Detected Clock Status: $CLOCK_STATUS"

          if [[ "$CLOCK_STATUS" == *"start"* ]]; then
            echo "status=start" >> $GITHUB_ENV
          else
            echo "status=stop" >> $GITHUB_ENV

      - name: Update Project Card Note
        if: ${{ github.event_name == 'project_card' }}
        run: |
          CARD_ID=$(jq -r '.project_card.id' $GITHUB_EVENT_PATH)
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"note\":\"${{ env.status }}\"}" \
            https://api.github.com/projects/columns/cards/$CARD_ID

      - name: Post Clock Comment for Issue/PR
        if: ${{ github.event_name == 'issues' || github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event_name == 'issues' && github.event.issue.number || github.event_name == 'pull_request' && github.event.pull_request.number }}
          body: |
            ${{ env.status == 'start' && ':alarm_clock: Clock Started!' || ':stopwatch: Clock Stopped!' }}
